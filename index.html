<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>4種類統合試験版｜新レイアウト試作品</title>
<style>
:root{
  --bg:#f3f6fb; --card:#fff; --text:#1a2740; --sub:#697b95; --line:#d9e3ef; --blue:#2b67c7;
  --blue2:#eef4ff; --good:#eaf8f0; --goodline:#27a167; --bad:#fff1f1; --badline:#e06464;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
a,button,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
main{max-width:860px;margin:0 auto;padding:18px 16px 40px}
.home-card,.app-card{background:var(--card);border-radius:22px;box-shadow:0 2px 18px rgba(22,47,80,.08);padding:22px}
.home-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}
.h1{font-size:25px;font-weight:800;margin:0}.sub{font-size:13px;color:var(--sub)}
.menu{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line);text-decoration:none;color:inherit;background:#fafcff}
.item:hover{background:#f4f8ff}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);font-size:21px;background:#fff;flex:none}
.title{font-size:17px;font-weight:800}.desc{font-size:12px;color:var(--sub);margin-top:4px}
.arrow{margin-left:auto;color:#8394ad;font-size:23px}
.app-card{padding:0;overflow:hidden}
.app-inner{padding:18px 16px 20px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.topbtn{background:none;border:none;color:var(--blue);font-weight:800;font-size:17px;padding:0}
.topbtn.right{text-align:right}
.progress-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:14px}
.count{font-size:18px;font-weight:800;white-space:nowrap}.time{font-size:18px;color:#647791;white-space:nowrap}
.track{height:10px;background:#e7edf5;border-radius:999px;overflow:hidden}.fill{height:100%;width:25%;background:var(--blue);border-radius:999px}
.meta-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:14px}
.meta{font-size:17px;color:#5f718b}
.navgroup{display:flex;gap:10px;align-items:center}
.smallbtn{min-width:62px;height:48px;padding:0 16px;border-radius:15px;border:1px solid var(--line);background:#fff;color:#254b85;font-weight:800;font-size:16px}
.smallbtn.icononly{min-width:0;width:54px;padding:0;font-size:24px;line-height:1}
.qbox{border-top:1px solid #eef2f7;padding-top:16px}
.qtext{font-size:17px;line-height:1.65;font-weight:800;margin:0 0 18px;letter-spacing:-.1px}
.toolrow{display:flex;justify-content:space-between;gap:14px;margin-bottom:14px}
.toolbtn{height:42px;min-width:58px;padding:0 14px;border-radius:15px;border:1px solid var(--line);background:#fff;color:#254b85;font-weight:800;font-size:15px}
.toolbtn.star{font-size:24px;padding:0 10px;min-width:58px}
.options{display:grid;gap:10px;margin-bottom:16px}
.optwrap{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:stretch}
.opt{border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;text-align:left;color:var(--text);min-height:74px}
.opt.active{background:var(--blue2);border-color:#83aae5;box-shadow:0 0 0 1px #83aae5 inset}
.opt.good{background:var(--good);border-color:var(--goodline)}
.opt.bad{background:var(--bad);border-color:var(--badline)}
.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eef2f8;color:#4e678d;font-weight:800;font-size:15px;flex:none}
.opttext{font-size:14px;line-height:1.45;font-weight:700}
.remove{width:56px;border-radius:15px;border:1px solid var(--line);background:#fff;color:#7385a0;font-weight:700;font-size:14px}
.feedback{margin:10px 0 14px;padding:14px 16px;border-radius:16px;font-size:17px;font-weight:800;display:none}
.feedback.good{display:block;background:var(--good);color:#0c6d43}.feedback.bad{display:block;background:var(--bad);color:#b23a3a}
.cta{width:100%;height:54px;border:none;border-radius:18px;background:var(--blue);color:#fff;font-weight:800;font-size:17px}
.cta:disabled{background:#8eaddd}
.results{padding:20px 16px}.resulttitle{font-size:23px;font-weight:800;margin:0 0 8px}.resultnum{font-size:34px;font-weight:900;margin:10px 0}.resultsub{font-size:15px;color:var(--sub);margin-bottom:18px}
@media (min-width: 700px){
  .app-card{border-radius:24px}
  .app-inner{padding:22px 24px 24px}
  .qtext{font-size:21px}
  .opttext{font-size:18px}
  .count,.time,.meta{font-size:18px}
}
</style>
</head>
<body>
<main>
  <section id="home" class="home-card">
    <div class="home-head">
      <div>
        <h1 class="h1">国家試験2027対策アプリ</h1>
        <div class="sub">4種類統合試験版｜新レイアウト試作品</div>
      </div>
      <div class="sub">操作確認用</div>
    </div>
    <div class="menu">
      <a class="item" href="#" data-app="grad"><div class="icon">▣</div><div><div class="title">卒試過去問</div><div class="desc">新レイアウト試作品</div></div><div class="arrow">›</div></a>
      <a class="item" href="#" data-app="term"><div class="icon">▤</div><div><div class="title">期末過去問</div><div class="desc">新レイアウト試作品</div></div><div class="arrow">›</div></a>
      <a class="item" href="#" data-app="class"><div class="icon">▥</div><div><div class="title">授業プリント問題集</div><div class="desc">新レイアウト試作品</div></div><div class="arrow">›</div></a>
      <a class="item" href="#" data-app="national"><div class="icon">▦</div><div><div class="title">国試過去問</div><div class="desc">新レイアウト試作品</div></div><div class="arrow">›</div></a>
    </div>
  </section>

  <section id="app" class="app-card hidden">
    <div class="app-inner">
      <div class="topline">
        <button class="topbtn" id="backBtn">← 戻る</button>
        <button class="topbtn right" id="finishTopBtn">終了</button>
      </div>
      <div class="progress-row">
        <div class="count" id="countText">1 / 3</div>
        <div class="track"><div class="fill" id="fillBar"></div></div>
        <div class="time" id="timerText">00:00</div>
      </div>
      <div class="meta-row">
        <div class="meta" id="metaText">R5・一次・午後　問1</div>
        <div class="navgroup">
          <button class="smallbtn icononly" id="prevBtn">‹</button>
          <button class="smallbtn" id="listBtn">問題一覧</button>
          <button class="smallbtn icononly" id="nextBtn">›</button>
        </div>
      </div>
      <div class="qbox">
        <p class="qtext" id="qtext"></p>
        <div class="toolrow">
          <button class="toolbtn star" id="starBtn">☆</button>
          <button class="toolbtn" id="editBtn">編集</button>
        </div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="cta" id="confirmBtn">解答を確定する</button>
      </div>
    </div>
    <div id="results" class="results hidden">
      <h2 class="resulttitle">演習結果</h2>
      <div class="resultnum" id="resultNum">0 / 0</div>
      <div class="resultsub" id="resultSub"></div>
      <button class="cta" id="backHomeFromResult">最初に戻る</button>
    </div>
  </section>
</main>
<script>
const apps={grad:'卒試過去問',term:'期末過去問',class:'授業プリント問題集',national:'国試過去問'};
const sampleQuestions=[
  {meta:'R5・一次・午後　問1',q:'IL運動（自立生活運動）の思想で正しいのはどれか。',options:['身の回りのことで他人の助けを借りてはならない。','職業を身につけることを最高の目標とする。','障害者の自己決定には責任と義務を伴う。','健常者と障害者が共に生活をする。'],answer:3},
  {meta:'R6・一次・午前　問8',q:'結核菌の発見者は誰か。',options:['ルイ・パスツール','ロベルト・コッホ','アルベール・カルメット','カミーユ・ゲラン'],answer:2},
  {meta:'R7・二次・午後　問16',q:'五行色体の組合せで正しいのはどれか。',options:['黄 ― 涕','青 ― 汗','南 ― 歌','皮 ― 唾'],answer:4}
];
let currentApp='grad', index=0, selected={}, answered={}, starred={}, startTime=null, timer=null;
const home=document.getElementById('home'), app=document.getElementById('app'), results=document.getElementById('results');
function fmt(sec){const m=String(Math.floor(sec/60)).padStart(2,'0');const s=String(sec%60).padStart(2,'0');return `${m}:${s}`}
function startApp(key){currentApp=key;home.classList.add('hidden');app.classList.remove('hidden');results.classList.add('hidden');document.querySelector('.resulttitle').textContent=apps[key]+'｜演習結果';index=0;selected={};answered={};startTime=Date.now();if(timer)clearInterval(timer);timer=setInterval(updateTimer,1000);render();}
function updateTimer(){if(!startTime)return;document.getElementById('timerText').textContent=fmt(Math.floor((Date.now()-startTime)/1000));}
function render(){const q=sampleQuestions[index];document.getElementById('countText').textContent=`${index+1} / ${sampleQuestions.length}`;document.getElementById('fillBar').style.width=`${((index+1)/sampleQuestions.length)*100}%`;document.getElementById('metaText').textContent=q.meta;document.getElementById('qtext').textContent=q.q;document.getElementById('starBtn').textContent=starred[index]?'★':'☆';document.getElementById('prevBtn').disabled=index===0;document.getElementById('nextBtn').disabled=index===sampleQuestions.length-1;
 const ops=document.getElementById('options'); ops.innerHTML=''; q.options.forEach((text,i)=>{const wrap=document.createElement('div');wrap.className='optwrap';const btn=document.createElement('button');let cls='opt';if(selected[index]===i+1)cls+=' active';if(answered[index]){if(i+1===q.answer)cls+=' good'; if(selected[index]===i+1 && selected[index]!==q.answer)cls+=' bad';}
 btn.className=cls; btn.innerHTML=`<span class="num">${i+1}</span><span class="opttext">${text}</span>`; btn.onclick=()=>{if(answered[index])return;selected[index]=i+1;render();}; const rm=document.createElement('button');rm.className='remove';rm.textContent='排除'; wrap.append(btn,rm); ops.append(wrap);});
 const fb=document.getElementById('feedback'); if(answered[index]){const ok=selected[index]===q.answer; fb.className='feedback '+(ok?'good':'bad'); fb.textContent=ok?'○ 正解':'× 不正解'; document.getElementById('confirmBtn').textContent=index===sampleQuestions.length-1?'結果を見る':'次の問題へ';} else {fb.className='feedback'; fb.textContent=''; document.getElementById('confirmBtn').textContent='解答を確定する';}
 document.getElementById('confirmBtn').disabled=!answered[index] && !selected[index];}
function nextStep(){if(!answered[index]){answered[index]=true;render();return;} if(index<sampleQuestions.length-1){index++;render();} else finish();}
function finish(){clearInterval(timer);const total=sampleQuestions.length;let correct=0;sampleQuestions.forEach((q,i)=>{if(selected[i]===q.answer)correct++;});document.getElementById('resultNum').textContent=`${correct} / ${total}`;document.getElementById('resultSub').textContent=`${apps[currentApp]} の試作品です。レイアウト確認用として3問だけ収録しています。`;document.querySelector('.app-inner').classList.add('hidden');results.classList.remove('hidden');}
function backHome(){if(timer)clearInterval(timer);app.classList.add('hidden');home.classList.remove('hidden');document.querySelector('.app-inner').classList.remove('hidden');}
document.querySelectorAll('[data-app]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();startApp(a.dataset.app)}));
document.getElementById('backBtn').onclick=backHome;document.getElementById('backHomeFromResult').onclick=backHome;document.getElementById('finishTopBtn').onclick=finish;document.getElementById('confirmBtn').onclick=nextStep;document.getElementById('prevBtn').onclick=()=>{if(index>0){index--;render()}};document.getElementById('nextBtn').onclick=()=>{if(index<sampleQuestions.length-1){index++;render()}};document.getElementById('listBtn').onclick=()=>alert('問題一覧の配置確認用ボタンです。次段階で一覧画面を接続します。');document.getElementById('editBtn').onclick=()=>alert('編集ボタンの配置確認用です。');document.getElementById('starBtn').onclick=()=>{starred[index]=!starred[index];render();};
</script>
</body>
</html>
