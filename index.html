<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>国家試験2027対策アプリ｜学校・問題集選択</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#18253a;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0;min-height:100dvh}main{max-width:830px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:clamp(21px,4vw,26px);line-height:1.4;margin:4px 0}h2{font-size:18px;margin:0}p{margin:0}
.eyebrow{font-size:12px;color:#5b718f;font-weight:750}.sub{font-size:13px;color:#63748a;line-height:1.7}
.panel{background:white;border:1px solid #e4ebf5;border-radius:18px;padding:20px;margin-top:22px;box-shadow:0 2px 18px #162f5010}
.section-head{margin-bottom:12px}.grid{display:grid;gap:12px;margin-top:16px}
.item{display:flex;align-items:center;gap:14px;min-height:85px;padding:16px;background:#f9fbfe;border:1px solid #dce5f1;border-radius:13px;color:#1b304d;text-decoration:none}
a.item:hover,a.item:focus-visible{background:#eef5ff;border-color:#98b9e6;outline-offset:3px}.item.pending{background:#f8f9fb;color:#566377}
.glyph{display:grid;place-items:center;flex:none;width:44px;height:44px;border:1px solid #d9e4f2;background:white;border-radius:11px;color:#2457a4;font-size:19px;font-weight:800}
.item.pending .glyph{color:#64748b}.item-main{flex:1;min-width:0}.item-title{font-weight:800;font-size:16px;line-height:1.5}
.item-desc{font-size:12px;color:#62748d;line-height:1.6;margin-top:4px}.arrow{color:#7690ad;font-size:22px}
.state{border:1px solid #dae1e9;border-radius:999px;padding:5px 9px;font-size:11px;color:#66768a;white-space:nowrap}
.back{display:inline-flex;align-items:center;color:#2457a4;text-decoration:none;font-size:13px;font-weight:750;margin:18px 0 0}
.hint{margin-top:16px;background:#f5f8fd;border-radius:11px;padding:12px;font-size:12px;line-height:1.75;color:#61738b}
.footer{margin-top:28px;font-size:12px;line-height:1.8;color:#62748d;text-align:center}.footer a,.hint a{color:#2457a4}
#content[aria-busy="true"]{min-height:80px}
@media(min-width:640px){.grid.schools{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.schools .item{min-height:150px;align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.panel{padding:16px;margin-top:17px}.item{padding:13px;min-height:75px}.glyph{width:39px;height:39px}.item-title{font-size:15px}}
</style>
</head>
<body>
<main>
<header>
<p class="eyebrow">国家試験・卒業試験対策</p>
<h1>国家試験2027対策アプリ</h1>
<p class="sub">学校と問題集を選んで学習を開始できます。</p>
</header>
<div id="content" aria-live="polite" aria-busy="true">
<section class="panel"><p class="sub">問題集の一覧を読み込んでいます。</p>
<noscript><p>JavaScriptを有効にするか、<a href="./oniki.html">鬼木学園アプリ</a>を開いてください。</p></noscript>
</section></div>
<footer class="footer">鬼木学園の従来画面からも問題集を選べます。
<a href="./oniki.html">鬼木学園アプリを直接開く</a></footer>
</main>
<script>
(function(){
'use strict';
var content=document.getElementById('content');
if(/^#app=(grad|term|class|national)$/.test(location.hash)){location.replace('./oniki.html'+location.hash);return;}
var catalog=null;
function node(tag,cls,value){
 var el=document.createElement(tag);
 if(cls)el.className=cls;
 if(value!==undefined)el.textContent=value;
 return el;
}
function makeCard(item,kind){
 var active=item.status!=='pending' && (kind==='category'?!!item.href:!!((item.categories&&item.categories.length)||item.entry_href));
 var el=node(active?'a':'div','item'+(active?'':' pending'));
 if(active)el.href=kind==='category'?item.href:((item.categories&&item.categories.length)?'#school='+encodeURIComponent(item.id):item.entry_href);
 var marks={grad:'卒',term:'期',class:'授',national:'国'};
 var symbol=kind==='category'?(marks[item.id]||'問'):(item.id==='oniki'?'あ':item.id==='nihon-isen'?'柔':'学');
 el.appendChild(node('span','glyph',symbol));
 var body=node('div','item-main');
 body.appendChild(node('div','item-title',item.title));
 body.appendChild(node('div','item-desc',kind==='category'?item.description:[item.subtitle,item.description].filter(Boolean).join('｜')));
 el.appendChild(body);
 el.appendChild(active?node('span','arrow','›'):node('span','state','準備中'));
 return el;
}
function panel(title,subtitle){
 var section=node('section','panel');
 var heading=node('h2','',title);
 var head=node('div','section-head');head.appendChild(heading);
 section.appendChild(head);
 if(subtitle)section.appendChild(node('p','sub',subtitle));
 return section;
}
function renderHome(){
 var section=panel('学校を選択','学習する学校・コースを選んでください。');
 var grid=node('div','grid schools');
 catalog.schools.forEach(function(s){grid.appendChild(makeCard(s,'school'));});
 section.appendChild(grid);
 section.appendChild(node('p','hint','学校や問題集を増やす場合も、同じ共有URLを使用できます。'));
 content.replaceChildren(section);
 document.title='国家試験2027対策アプリ｜学校選択';
}
function renderSchool(s){
 var link=node('a','back','‹ 学校選択に戻る');link.href='./';
 var section=panel(s.title+'｜問題集',s.description||'問題集を選んでください。');
 var grid=node('div','grid');
 (s.categories||[]).forEach(function(c){grid.appendChild(makeCard(c,'category'));});
 section.appendChild(grid);
 content.replaceChildren(link,section);
 document.title=s.title+'｜問題集｜国家試験2027対策';
}
function render(){
 if(!catalog)return;
 var id='';
 if(location.hash.indexOf('#school=')===0){try{id=decodeURIComponent(location.hash.slice(8));}catch(e){}}
 var selected=catalog.schools.find(function(s){return s.id===id&&s.status!=='pending'&&s.categories&&s.categories.length;});
 if(selected)renderSchool(selected);else renderHome();
 content.removeAttribute('aria-busy');
}
function errorState(){
 var section=panel('問題集一覧を読み込めませんでした','通信状況を確認して再読み込みしてください。');
 var link=node('a','back','鬼木学園アプリを開く');link.href='./oniki.html';
 section.appendChild(link);content.replaceChildren(section);
 content.removeAttribute('aria-busy');
}
window.addEventListener('hashchange',render);
fetch('./app-catalog.json',{cache:'no-store'})
 .then(function(r){if(!r.ok)throw new Error('Catalog HTTP '+r.status);return r.json();})
 .then(function(data){if(!data||!Array.isArray(data.schools))throw new Error('Invalid catalog');catalog=data;render();})
 .catch(function(){errorState();});
}());
</script>
</body></html>
