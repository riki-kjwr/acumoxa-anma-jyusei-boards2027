<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D1接続確認</title>
<style>body{font-family:system-ui,sans-serif;max-width:650px;margin:40px auto;padding:16px;line-height:1.5}button{padding:12px;cursor:pointer}article{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:8px}small{color:#666}</style>
<h1>D1接続確認（20問）</h1><p>既存の国試アプリとは独立した試験画面です。⭐️・学習履歴には触れません。</p>
<button id="load">20問を読み込む</button><p id="status"></p><div id="list"></div>
<script>
document.querySelector('#load').onclick=async()=>{
 const status=document.querySelector('#status'),list=document.querySelector('#list');list.replaceChildren();status.textContent='読み込み中…';
 try {
  const r=await fetch('/api/questions?limit=20');const data=await r.json();
  if(!r.ok)throw Error(data.error||r.status);
  status.textContent=data.count+'問を読み込みました。';
  for(const q of data.questions) {
   const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),s=document.createElement('small');
   h.textContent=q.subject+' / '+q.id;p.textContent=q.question_text;
   s.textContent=[q.option1,q.option2,q.option3,q.option4].map((v,i)=>(i+1)+'. '+v).join(' ｜ ');
   a.append(h,p,s);list.append(a);
  }
 }catch(e){status.textContent='読み込みできません: '+e.message;}
};
</script></html>
